# Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml

services:
  # ─── Node.js Backend API ───────────────────────────────────────────────────
  - type: web
    name: nand-kumar-portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://nandkumarcoder.github.io
